[package]
name = "omessaged"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"

[dependencies]
anyhow = "1.0.104"
nostr = { version = "0.45", features = ["nip59", "nip44", "os-rng"] }
nostr-sdk = "0.45"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal", "process", "fs"] }
zbus = { version = "6", default-features = false, features = ["tokio"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
